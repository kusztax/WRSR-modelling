; wrsr_rail_mod - settings. Save as UTF-8 WITHOUT BOM, ASCII values only
; (read through the ANSI profile API; a BOM breaks the section header).

[wrsr_rail_mod]
; 0 = the plugin declines to load and hooks nothing.
enabled = 1

; Installs and calls a hook on a function inside this DLL at startup, to prove
; that code patching works under Wine + Rosetta 2. Touches no game code.
minhook_selftest = 1

; 1 = also log the first 32 bytes at the .text entry and PE layout details.
verbose = 0
