; wrsr_rail_mod - settings. Save as UTF-8 WITHOUT BOM, ASCII values only
; (read through the ANSI profile API; a BOM breaks the section header).

[wrsr_rail_mod]
; 0 = the plugin declines to load and hooks nothing.
enabled = 1

; Diagnostics: at startup, hooks and calls a function inside this DLL to prove
; that code patching works (Wine / CrossOver / Rosetta 2). Touches no game code.
minhook_selftest = 0

; ---- signal priority -------------------------------------------------------
; 1 = when a freight train and a passenger train wait for the same block at two
; different signals, the passenger train goes first. 0 = the game decides,
; everywhere, and the Scripts menu buttons do nothing.
; In game, Options -> Scripts has an ON and an OFF button; that choice is kept
; per save. A save that never pressed OFF has the priority ON.
priority = 1

; Maximum wait, in seconds: a freight train waits at most this long (counted
; from the first time it was held at a signal) for passenger trains; then it
; gets the next free block, and the passenger trains wait for it. One of 30, 60,
; 90, 120, 180. This is the default; the Scripts menu has a button that sets it
; per save (30 -> 60 -> 90 -> 120 -> 180).
max_hold_s = 60

; While a freight train is held, its signal shows red (1). 0 = the signal shows
; green while the train waits, as in version 1.0.
signal_aspect = 1

; ---- research logging (off for normal play) --------------------------------
; Log every WAIT / GO change at signals, with the block each train waits for.
signal_census = 0

; Log-only hook on the rail acceleration helper: consist of each train, station
; approaches, speed every 30 s. Not needed for the priority.
train_census = 0

; Census and priority lines per game session, then silence.
census_log_limit = 3000
