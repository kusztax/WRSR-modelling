; wrsr_rail_mod - settings. Save as UTF-8 WITHOUT BOM, ASCII values only
; (read through the ANSI profile API; a BOM breaks the section header).

[wrsr_rail_mod]
; 0 = the plugin declines to load and hooks nothing.
enabled = 1

; Installs and calls a hook on a function inside this DLL at startup, to prove
; that code patching works under Wine + Rosetta 2. Touches no game code.
minhook_selftest = 1

; M1 research: hooks the rail acceleration helper through the loader, LOG ONLY.
; The game's own result is returned untouched. Logs each train once (consist,
; passenger or not, which block it engages) and every block change, plus a
; chain-type histogram every 60 s. 0 = hook nothing.
train_census = 1

; Census lines per game session, then silence (keeps the log readable).
census_log_limit = 3000
