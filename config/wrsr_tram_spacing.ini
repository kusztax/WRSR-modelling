; wrsr_tram_spacing (Tram & Railcar Spacing) - settings. Save as UTF-8 WITHOUT
; BOM, ASCII values only.

[wrsr_tram_spacing]
; 1 = tram and railcar lines get the game's own line spacing switch in the line
; window (vanilla offers it only for road lines). Switched per line in game and
; kept in the save. 0 = the plugin declines to load and the game is unchanged.
enabled = 1
